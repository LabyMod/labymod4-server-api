name: Gradle Build Workflow

on:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
      BEARER_TOKEN: ${{ secrets.LABYMOD_BEARER_TOKEN }}
      PUBLISH_TOKEN: ${{ secrets.LABYMOD_PUBLISH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Release Artifacts with Gradle
        run: ./gradlew build
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Artifacts
          path: build/commonOutput/*.jar
      - name: Grant execute permission for output
        run: chmod +x build/commonOutput/*.jar
      - name: Upload Assets to Release
        id: upload-release-asset
        uses: sekwah41/upload-release-assets@c567fc0fd9cbda3da23f1b498ee7f0446b649aed # v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: build/commonOutput/*.jar
          asset_content_type: application/zip
      - name: Clean Gradle
        run: ./gradlew clean
      - name: Publish Application
        env:
          DEFAULT_BUILD: 'true'
        run: ./gradlew publish
